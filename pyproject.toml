[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"

[tool.djlint]
profile = "django"
extension = "html"
indent = 2
max_line_length = 120
ignore = "H030,H031"
