<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- Mosaico de fondo: huellas de perro y gato giradas ±45°, intercaladas.
       Se usa como máscara (solo importa la forma); el color lo pone el CSS, con la variable hu-huella. -->
  <defs>
    <g id="perro">
      <path d="M0 0C5 0 9 4 12 9 14.5 13 13 18 8.5 18 5.5 18 3 16.5 0 16.5S-5.5 18-8.5 18C-13 18-14.5 13-12 9-9 4-5 0 0 0Z"/>
      <ellipse cx="-15" cy="-2" rx="4.4" ry="6.2" transform="rotate(-30 -15 -2)"/>
      <ellipse cx="-5.6" cy="-11.5" rx="4.5" ry="6.6" transform="rotate(-10 -5.6 -11.5)"/>
      <ellipse cx="5.6" cy="-11.5" rx="4.5" ry="6.6" transform="rotate(10 5.6 -11.5)"/>
      <ellipse cx="15" cy="-2" rx="4.4" ry="6.2" transform="rotate(30 15 -2)"/>
    </g>
    <g id="gato">
      <path d="M0-2C6.5-2 13 3.5 13 9.5 13 14.5 10 16.5 7.4 15 5.8 17.6 2.2 18 0 16.4-2.2 18-5.8 17.6-7.4 15-10 16.5-13 14.5-13 9.5-13 3.5-6.5-2 0-2Z"/>
      <circle cx="-13" cy="-6" r="4.2"/>
      <circle cx="-4.6" cy="-13.2" r="4.4"/>
      <circle cx="4.6" cy="-13.2" r="4.4"/>
      <circle cx="13" cy="-6" r="4.2"/>
    </g>
  </defs>
  <!-- Fila 1 -->
  <use xlink:href="#perro" href="#perro" transform="translate(50 45) rotate(45)"/>
  <use xlink:href="#gato" href="#gato" transform="translate(150 45) rotate(-45)"/>
  <!-- Fila 2, corrida medio paso; la huella del borde se repite a ambos lados para empalmar -->
  <use xlink:href="#perro" href="#perro" transform="translate(0 145) rotate(-45)"/>
  <use xlink:href="#perro" href="#perro" transform="translate(200 145) rotate(-45)"/>
  <use xlink:href="#gato" href="#gato" transform="translate(100 145) rotate(45)"/>
</svg>
