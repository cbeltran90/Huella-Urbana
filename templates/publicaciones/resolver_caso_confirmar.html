{% extends "base.html" %}
{% block titulo %}Cerrar el caso · Huella Urbana{% endblock %}
{% block contenido %}
  <section class="mx-auto max-w-lg rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-bold">¿Cerrar el caso?</h1>
    <p class="mt-2 text-sm text-stone-600">
      Al cerrar el caso, el aviso deja de verse en el mapa y en la lista. Gracias por avisar.
    </p>
    <form method="post" class="mt-4 flex flex-wrap gap-3">
      {% csrf_token %}
      <button type="submit"
              class="inline-flex min-h-11 items-center rounded bg-stone-800 px-4 text-white">
        Sí, cerrar el caso
      </button>
      <a href="{{ volver }}"
         class="inline-flex min-h-11 items-center rounded border px-4">Cancelar</a>
    </form>
  </section>
{% endblock %}
