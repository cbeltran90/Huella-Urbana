{% extends "base.html" %}
{% block titulo %}Cerrar el caso · Huella Urbana{% endblock %}
{% block contenido %}
  <section class="panel mx-auto max-w-lg">
    <h1 class="text-2xl font-bold">¿Cerrar el caso?</h1>
    <p class="mt-2 text-sm text-suave">
      Al cerrar el caso, el aviso deja de verse en el mapa y en la lista. Gracias por avisar.
    </p>
    <form method="post" class="mt-4 flex flex-wrap gap-3">
      {% csrf_token %}
      <button type="submit" class="boton-primario">Sí, cerrar el caso</button>
      <a href="{{ volver }}" class="boton-secundario">Cancelar</a>
    </form>
  </section>
{% endblock %}
