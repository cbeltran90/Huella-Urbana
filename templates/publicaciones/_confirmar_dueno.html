{% if extravios %}
  <h2 class="mt-6 text-lg font-semibold">¿Apareció el dueño?</h2>
  <p class="mt-1 text-sm text-stone-600">Si es quien lo estaba buscando, confirmalo.</p>
  <ul class="mt-2 space-y-2 text-sm">
    {% for extravio in extravios %}
      <li>
        {{ extravio.autor.nombre_usuario }} lo busca desde el {{ extravio.fecha|date:"j/n/Y" }} ·
        <a href="{% url 'publicaciones:confirmar_dueno' extravio.pk %}"
           class="inline-flex min-h-11 items-center underline">Es el dueño</a>
      </li>
    {% endfor %}
  </ul>
{% endif %}
