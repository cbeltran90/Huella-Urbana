{# Solo perdidos tiene más de un tipo para elegir. #}
{% if tipos %}
  <label class="flex flex-col">
    Tipo
    <select name="tipo" class="rounded border px-2 py-1">
      <option value="">Todos</option>
      {% for valor, nombre in tipos %}
        <option value="{{ valor }}" {% if filtros.tipo == valor %}selected{% endif %}>{{ nombre }}</option>
      {% endfor %}
    </select>
  </label>
{% endif %}
<label class="flex flex-col">
  Especie
  <select name="especie" class="rounded border px-2 py-1">
    <option value="">Todas</option>
    {% for valor, nombre in especies %}
      <option value="{{ valor }}"
              {% if filtros.especie == valor %}selected{% endif %}>{{ nombre }}</option>
    {% endfor %}
  </select>
</label>
<label class="flex flex-col">
  Tamaño
  <select name="tamano" class="rounded border px-2 py-1">
    <option value="">Todos</option>
    {% for valor, nombre in tamanos %}
      <option value="{{ valor }}"
              {% if filtros.tamano == valor %}selected{% endif %}>{{ nombre }}</option>
    {% endfor %}
  </select>
</label>
