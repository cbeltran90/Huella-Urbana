{% extends "base.html" %}
{% block titulo %}Desvincular publicación · Huella Urbana{% endblock %}
{% block contenido %}
  <section class="mx-auto max-w-lg rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-bold">¿Desvincular esta publicación?</h1>
    <p class="mt-2 text-sm text-stone-600">
      La publicación se separa de la ficha y queda suelta: podrá vincularse a otra ficha o generar una nueva.
    </p>
    <form method="post" class="mt-4 flex gap-3">
      {% csrf_token %}
      <button type="submit" class="rounded bg-stone-800 px-3 py-1 text-white">Sí, desvincular</button>
      <a href="{% url 'publicaciones:detalle' publicacion.pk %}"
         class="rounded border px-3 py-1">Cancelar</a>
    </form>
  </section>
{% endblock %}
