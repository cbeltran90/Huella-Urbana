{% extends "base.html" %}
{% block titulo %}Editar perfil · Huella Urbana{% endblock %}
{% block contenido %}
  <section class="panel mx-auto max-w-md">
    <h1 class="text-2xl font-bold">Editar perfil</h1>
    <form method="post" novalidate class="mt-4 space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_nombre_usuario" class="titulo-campo">Nombre de usuario</label>
        <input type="text"
               name="nombre_usuario"
               id="id_nombre_usuario"
               value="{{ form.nombre_usuario.value|default_if_none:'' }}"
               maxlength="150"
               autocomplete="username"
               class="campo mt-1">
        {% include "cuentas/_errores.html" with errores=form.nombre_usuario.errors %}
      </div>
      <button type="submit" class="boton-primario w-full">Guardar cambios</button>
      <a href="{% url 'cuentas:perfil' %}" class="enlace-volver">Cancelar</a>
    </form>
  </section>
{% endblock %}
