{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Huella Urbana{% endblock %}</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="32x32">
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
    <link rel="stylesheet"
          href="{% static 'vendor/markercluster/MarkerCluster.css' %}">
    <link rel="stylesheet"
          href="{% static 'vendor/markercluster/MarkerCluster.Default.css' %}">
    <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/alpine/alpine.min.js' %}" defer></script>
    <script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
    <script>
      L.Icon.Default.imagePath = "";
      L.Icon.Default.mergeOptions({
        iconUrl: "{% static 'vendor/leaflet/images/marker-icon.png' %}",
        iconRetinaUrl: "{% static 'vendor/leaflet/images/marker-icon-2x.png' %}",
        shadowUrl: "{% static 'vendor/leaflet/images/marker-shadow.png' %}",
      });
    </script>
    <script src="{% static 'vendor/markercluster/leaflet.markercluster.js' %}"></script>
    <script src="{% static 'vendor/leaflet-heat/leaflet-heat.js' %}"></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-fondo text-texto"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="border-b bg-superficie">
      <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between p-4">
        <a href="{% url 'core:inicio' %}"
           class="flex items-center gap-2 text-lg font-semibold text-primario">
          <span class="icono-sitio" aria-hidden="true"></span>
          Huella Urbana
        </a>
        {% block nav %}
          {% include "componentes/_nav.html" %}
        {% endblock %}
      </nav>
    </header>
    <main class="mx-auto max-w-5xl p-4">
      {% block contenido %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
  </body>
</html>
