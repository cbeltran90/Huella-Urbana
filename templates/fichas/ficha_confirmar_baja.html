{% extends "base.html" %}
{% block titulo %}Dar de baja · Huella Urbana{% endblock %}
{% block contenido %}
  <section class="panel mx-auto max-w-md">
    <h1 class="text-2xl font-bold">Dar de baja la ficha</h1>
    <p class="mt-2 text-sm">
      Vas a eliminar la ficha de <strong>{{ ficha.nombre|default:"esta mascota" }}</strong>. Esta acción no se puede deshacer.
    </p>
    <form method="post" class="mt-4 flex gap-3">
      {% csrf_token %}
      <button type="submit" class="boton-peligro flex-1">Sí, dar de baja</button>
      <a href="{% url 'fichas:detalle' ficha.pk %}" class="boton-secundario">Cancelar</a>
    </form>
  </section>
{% endblock %}
